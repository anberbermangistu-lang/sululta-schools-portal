<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password | Sululta Secondary School</title>

<link rel="stylesheet" href="/src/style.css">
</head>

<body>
<div class="login-page">

    <div class="login-box">

        <div class="login-logo">
            SS
        </div>

        <h1>Reset Password</h1>

        <p class="login-subtitle">
            Create a new password for your account.
        </p>

        <form id="resetPasswordForm">

            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter new password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm new password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>

            <button
                type="submit"
                id="updatePasswordButton"
            >
                Update Password
            </button>

            <p
                id="resetMessage"
                class="login-message"
                hidden
            ></p>

        </form>

        <div class="forgot-password-back">

            <a href="/login.html">
                ← Back to Login
            </a>

        </div>

    </div>

</div>

<script
    type="module"
    src="/src/reset-password.js"
></script>
</body>

</html>
