<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Details | Sululta School Portal</title>
    <link rel="stylesheet" href="../src/style.css">
    <link rel="stylesheet" href="../src/sidebar.css">
    <link rel="stylesheet" href="../src/responsive.css">
</head>
<body>
<div class="admin-page">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a class="logo" href="../admin/dashboard.html">
                <img src="../public/school-logo.svg" alt="Logo" class="logo-image">
                <span class="logo-text">Sululta School</span>
            </a>
        </div>
        <nav class="sidebar-nav" aria-label="Admin navigation">
            <a href="../admin/dashboard.html" class="nav-item"><span class="nav-text">Dashboard</span></a>
            <a href="../students/dashboard.html" class="nav-item"><span class="nav-text">Students</span></a>
            <a href="../teachers/dashboard.html" class="nav-item"><span class="nav-text">Teachers</span></a>
            <a href="../classes/dashboard.html" class="nav-item"><span class="nav-text">Classes</span></a>
            <a href="dashboard.html" class="nav-item active"><span class="nav-text">Subjects</span></a>
            <a href="../attendance/dashboard.html" class="nav-item"><span class="nav-text">Attendance</span></a>
            <a href="../results/dashboard.html" class="nav-item"><span class="nav-text">Results</span></a>
            <a href="../timetable/dashboard.html" class="nav-item"><span class="nav-text">Timetable</span></a>
            <a href="../library/dashboard.html" class="nav-item"><span class="nav-text">Library</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="nav-item" id="logoutBtn"><span class="nav-text">Logout</span></a>
        </div>
    </aside>

    <main class="admin-main">
        <header class="admin-header">
            <div class="header-left">
                <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle navigation">Menu</button>
                <div>
                    <span class="header-label">Academic Management</span>
                    <h1>Subject Details</h1>
                </div>
            </div>
        </header>

        <section class="page-container">
            <div class="page-header">
                <div>
                    <h2 id="subjectTitle">Loading subject...</h2>
                    <p id="subjectSubtitle">Please wait while subject information is loaded.</p>
                </div>
                <div class="header-actions">
                    <a href="dashboard.html" class="btn btn-secondary">Back to Subjects</a>
                    <a href="#" id="editSubjectButton" class="btn btn-primary">Edit Subject</a>
                </div>
            </div>

            <div id="message" class="message" hidden></div>

            <section id="subjectContent" class="form-card">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="subjectName">Subject Name</label>
                        <input type="text" id="subjectName" readonly>
                    </div>
                    <div class="form-group">
                        <label for="subjectCode">Subject Code</label>
                        <input type="text" id="subjectCode" readonly>
                    </div>
                    <div class="form-group">
                        <label for="gradeLevel">Grade Level</label>
                        <input type="text" id="gradeLevel" readonly>
                    </div>
                    <div class="form-group">
                        <label for="credit">Credit</label>
                        <input type="text" id="credit" readonly>
                    </div>
                    <div class="form-group">
                        <label for="status">Status</label>
                        <input type="text" id="status" readonly>
                    </div>
                    <div class="form-group">
                        <label for="createdAt">Created</label>
                        <input type="text" id="createdAt" readonly>
                    </div>
                    <div class="form-group full-width">
                        <label for="description">Description</label>
                        <textarea id="description" rows="5" readonly></textarea>
                    </div>
                </div>
            </section>
        </section>
    </main>
</div>
<script type="module" src="../src/view-subject.js"></script>
</body>
</html>
