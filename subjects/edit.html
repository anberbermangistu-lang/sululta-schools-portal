<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Subject | Sululta School Portal</title>
    <link rel="stylesheet" href="../src/style.css">
    <link rel="stylesheet" href="../src/sidebar.css">
    <link rel="stylesheet" href="../src/responsive.css">
</head>
<body>
<div class="admin-page">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a class="logo" href="../admin/dashboard.html">
                <img src="../public/school-logo.svg" alt="Logo" class="logo-image">
                <span class="logo-text">Sululta School</span>
            </a>
        </div>
        <nav class="sidebar-nav" aria-label="Admin navigation">
            <a href="../admin/dashboard.html" class="nav-item"><span class="nav-text">Dashboard</span></a>
            <a href="../students/dashboard.html" class="nav-item"><span class="nav-text">Students</span></a>
            <a href="../teachers/dashboard.html" class="nav-item"><span class="nav-text">Teachers</span></a>
            <a href="../classes/dashboard.html" class="nav-item"><span class="nav-text">Classes</span></a>
            <a href="dashboard.html" class="nav-item active"><span class="nav-text">Subjects</span></a>
            <a href="../attendance/dashboard.html" class="nav-item"><span class="nav-text">Attendance</span></a>
            <a href="../results/dashboard.html" class="nav-item"><span class="nav-text">Results</span></a>
            <a href="../timetable/dashboard.html" class="nav-item"><span class="nav-text">Timetable</span></a>
            <a href="../library/dashboard.html" class="nav-item"><span class="nav-text">Library</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="nav-item" id="logoutBtn"><span class="nav-text">Logout</span></a>
        </div>
    </aside>

    <main class="admin-main">
        <header class="admin-header">
            <div class="header-left">
                <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle navigation">Menu</button>
                <div>
                    <span class="header-label">Academic Management</span>
                    <h1>Edit Subject</h1>
                </div>
            </div>
        </header>

        <section class="page-container">
            <div class="page-header">
                <div>
                    <h2>Edit Subject</h2>
                    <p>Update the subject's academic information.</p>
                </div>
                <div class="header-actions">
                    <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
                </div>
            </div>

            <div id="message" class="message" hidden></div>

            <section class="form-card">
                <form id="editSubjectForm" novalidate>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="subjectName">Subject Name <span>*</span></label>
                            <input type="text" id="subjectName" required>
                        </div>
                        <div class="form-group">
                            <label for="subjectCode">Subject Code <span>*</span></label>
                            <input type="text" id="subjectCode" required>
                        </div>
                        <div class="form-group">
                            <label for="gradeLevel">Grade Level <span>*</span></label>
                            <input type="text" id="gradeLevel" required>
                        </div>
                        <div class="form-group">
                            <label for="credit">Credit</label>
                            <input type="number" id="credit" min="0" step="0.5">
                        </div>
                        <div class="form-group full-width">
                            <label for="description">Description</label>
                            <textarea id="description" rows="5"></textarea>
                        </div>
                    </div>
                    <div class="form-actions">
                        <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
                        <button type="submit" id="saveButton" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </section>
        </section>
    </main>
</div>
<script type="module" src="../src/edit-subject.js"></script>
</body>
</html>
