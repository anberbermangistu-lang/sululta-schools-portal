<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delete Event | Sululta School Portal</title>

    <link
        rel="icon"
        href="data:,"
    >

    <link
        rel="stylesheet"
        href="../src/style.css"
    >

</head>

<body>

<div class="dashboard-layout">

    <aside class="sidebar">

        <div class="sidebar-brand">

            <div class="sidebar-icon">
                🏫
            </div>

            <div>
                <strong>Sululta School</strong>
                <span>School Portal</span>
            </div>

        </div>

        <nav class="sidebar-menu">

            <a href="../dashboard.html">🏠 Dashboard</a>
            <a href="../students/dashboard.html">👨‍🎓 Students</a>
            <a href="../teachers/dashboard.html">👨‍🏫 Teachers</a>
            <a href="../subjects/dashboard.html">📚 Subjects</a>
            <a href="../timetable/dashboard.html">🗓️ Timetable</a>
            <a href="dashboard.html" class="active">📅 Events</a>
            <a href="../books/dashboard.html">📖 Books</a>
            <a href="../results/dashboard.html">📊 Results</a>

        </nav>

    </aside>

    <main class="main-content">

        <header class="page-header">

            <div>

                <h1>
                    🗑️ Delete Event
                </h1>

                <p>
                    Remove an event from the school portal
                </p>

            </div>

            <a
                href="dashboard.html"
                class="btn-secondary"
            >
                ← Back
            </a>

        </header>

        <section class="content-card">

            <div
                id="loading"
                class="loading-cell"
            >
                Loading event...
            </div>

            <div
                id="deleteContent"
                style="display:none;"
            >

                <div class="empty-state">

                    <div class="empty-icon">
                        🗑️
                    </div>

                    <h3>
                        Delete This Event?
                    </h3>

                    <p id="eventInfo">
                        -
                    </p>

                    <p>
                        This action cannot be undone.
                    </p>

                    <div
                        id="message"
                        class="form-message"
                    ></div>

                    <div class="form-actions">

                        <a
                            href="dashboard.html"
                            class="btn-secondary"
                        >
                            Cancel
                        </a>

                        <button
                            type="button"
                            id="deleteButton"
                            class="timetable-action timetable-action-delete"
                            style="height:42px;padding:0 18px;"
                        >
                            🗑 Delete Event
                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>

<script type="module">

import { supabase } from "../src/supabase.js";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const loading = document.getElementById("loading");
const content = document.getElementById("deleteContent");
const eventInfo = document.getElementById("eventInfo");
const message = document.getElementById("message");
const deleteButton = document.getElementById("deleteButton");

if (!id) {

    loading.textContent =
        "No event ID was provided.";

} else {

    loadEvent();

}

async function loadEvent() {

    const { data, error } = await supabase
        .from("events")
        .select(`
            id,
            event_name,
            event_type,
            event_date,
            start_time,
            end_time,
            location
        `)
        .eq("id", id)
        .single();

    if (error || !data) {

        console.error(error);

        loading.textContent =
            "Event could not be found.";

        return;
    }

    loading.style.display = "none";
    content.style.display = "block";

    eventInfo.innerHTML = `
        <strong>${escapeHtml(data.event_name || "-")}</strong>
        <br>
        ${escapeHtml(data.event_type || "-")}
        <br>
        ${formatDate(data.event_date)}
        <br>
        ${formatTime(data.start_time)}
        -
        ${formatTime(data.end_time)}
        <br>
        📍 ${escapeHtml(data.location || "-")}
    `;
}

deleteButton.addEventListener("click", async () => {

    deleteButton.disabled = true;
    deleteButton.textContent = "Deleting...";

    message.textContent = "";
    message.className = "form-message";

    const { error } = await supabase
        .from("events")
        .delete()
        .eq("id", id);

    if (error) {

        console.error("Failed to delete event:", error);

        message.textContent =
            error.message || "Failed to delete event.";

        message.className =
            "form-message error";

        deleteButton.disabled = false;
        deleteButton.textContent = "🗑 Delete Event";

        return;
    }

    message.textContent =
        "Event deleted successfully.";

    message.className =
        "form-message success";

    setTimeout(() => {
        window.location.href = "dashboard.html";
    }, 800);

});

function formatDate(value) {

    if (!value) {
        return "-";
    }

    const date = new Date(`${value}T00:00:00`);

    return date.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric"
    });
}

function formatTime(value) {

    if (!value) {
        return "-";
    }

    const parts = String(value).split(":");

    if (parts.length < 2) {
        return value;
    }

    let hour = Number(parts[0]);
    const minute = parts[1];

    const suffix = hour >= 12 ? "PM" : "AM";

    hour = hour % 12 || 12;

    return `${hour}:${minute} ${suffix}`;
}

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

</script>

</body>
</html>
