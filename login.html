<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Sululta Secondary School</title>

<link rel="stylesheet" href="/src/style.css">
</head>

<body>
<div class="login-page">

    <div class="login-box">

        <div class="login-logo">
            SS
        </div>

        <h1>Sululta Secondary School</h1>

        <p class="login-subtitle">
            School Management Portal
        </p>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <div class="forgot-password">
                    <a href="/forgot-password.html">
                        Forgot Password?
                    </a>
                </div>

            </div>

            <button
                type="submit"
                id="loginButton"
            >
                Login
            </button>

            <p
                id="loginMessage"
                class="login-message"
                hidden
            ></p>

        </form>

    </div>

</div>

<script
    type="module"
    src="/src/login.js"
></script>
</body>

</html>
