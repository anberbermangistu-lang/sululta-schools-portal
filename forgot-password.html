<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | Sululta Secondary School</title>

<link rel="stylesheet" href="/src/style.css">

</head>

<body>
<div class="login-page">

    <div class="login-box">

        <div class="login-logo">
            
        </div>

        <h1>Forgot Password?</h1>

        <p class="login-subtitle">
            Enter your registered email and we will send you a password reset link.
        </p>

        <form id="forgotPasswordForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >

            </div>

            <button
                type="submit"
                id="resetButton"
            >
                Send Reset Link
            </button>

            <p
                id="forgotMessage"
                class="login-message"
                hidden
            ></p>

        </form>

        <div class="forgot-password-back">

            <a href="/login.html">
                ← Back to Login
            </a>

        </div>

    </div>

</div>

<script
    type="module"
    src="/src/forgot-password.js"
></script>
</body>

</html>
