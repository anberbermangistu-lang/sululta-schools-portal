<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="48" fill="#0a2d6e" stroke="#fff" stroke-width="2"/>
  <!-- Middle ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#4a9fd4" stroke-width="1.5"/>
  <!-- Inner background -->
  <circle cx="50" cy="50" r="38" fill="#1a4a9e"/>

  <!-- Laurel branches left -->
  <g fill="#4caf50">
    <ellipse cx="22" cy="55" rx="5" ry="2.5" transform="rotate(-40 22 55)"/>
    <ellipse cx="19" cy="62" rx="5" ry="2.5" transform="rotate(-55 19 62)"/>
    <ellipse cx="20" cy="69" rx="5" ry="2.5" transform="rotate(-65 20 69)"/>
    <ellipse cx="24" cy="75" rx="5" ry="2.5" transform="rotate(-75 24 75)"/>
    <ellipse cx="26" cy="46" rx="5" ry="2.5" transform="rotate(-25 26 46)"/>
  </g>
  <!-- Laurel branches right -->
  <g fill="#4caf50">
    <ellipse cx="78" cy="55" rx="5" ry="2.5" transform="rotate(40 78 55)"/>
    <ellipse cx="81" cy="62" rx="5" ry="2.5" transform="rotate(55 81 62)"/>
    <ellipse cx="80" cy="69" rx="5" ry="2.5" transform="rotate(65 80 69)"/>
    <ellipse cx="76" cy="75" rx="5" ry="2.5" transform="rotate(75 76 75)"/>
    <ellipse cx="74" cy="46" rx="5" ry="2.5" transform="rotate(25 74 46)"/>
  </g>

  <!-- Open book -->
  <g transform="translate(50,50)">
    <!-- Book spine -->
    <rect x="-1.5" y="-10" width="3" height="18" fill="#fff" rx="1"/>
    <!-- Left page -->
    <path d="M-1.5,-8 C-12,-8 -22,-5 -22,5 L-22,8 C-22,-2 -12,-4 -1.5,-4 Z" fill="#dbeafe"/>
    <!-- Right page -->
    <path d="M1.5,-8 C12,-8 22,-5 22,5 L22,8 C22,-2 12,-4 1.5,-4 Z" fill="#dbeafe"/>
    <!-- Lines on left page -->
    <line x1="-18" y1="-2" x2="-5" y2="-3" stroke="#94a3b8" stroke-width="1" opacity="0.7"/>
    <line x1="-17" y1="1" x2="-5" y2="0" stroke="#94a3b8" stroke-width="1" opacity="0.7"/>
    <line x1="-16" y1="4" x2="-5" y2="3.5" stroke="#94a3b8" stroke-width="1" opacity="0.7"/>
    <!-- Lines on right page -->
    <line x1="18" y1="-2" x2="5" y2="-3" stroke="#94a3b8" stroke-width="1" opacity="0.7"/>
    <line x1="17" y1="1" x2="5" y2="0" stroke="#94a3b8" stroke-width="1" opacity="0.7"/>
    <line x1="16" y1="4" x2="5" y2="3.5" stroke="#94a3b8" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- Rays / graduation sunburst above book -->
  <g fill="#f59e0b" opacity="0.9">
    <rect x="49" y="18" width="2" height="8" rx="1"/>
    <rect x="49" y="18" width="2" height="8" rx="1" transform="rotate(30 50 50)"/>
    <rect x="49" y="18" width="2" height="8" rx="1" transform="rotate(-30 50 50)"/>
    <rect x="49" y="18" width="2" height="8" rx="1" transform="rotate(60 50 50)"/>
    <rect x="49" y="18" width="2" height="8" rx="1" transform="rotate(-60 50 50)"/>
  </g>

  <!-- Bottom ribbon -->
  <path d="M20,78 Q50,88 80,78 L80,84 Q50,94 20,84 Z" fill="#1e3a8a"/>
  <text x="50" y="83" text-anchor="middle" font-size="5.5" font-family="Arial, sans-serif" font-weight="bold" fill="#fbbf24" letter-spacing="0.5">SULULTA</text>
</svg>
