<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Class | Sululta School Portal</title>

    <link rel="stylesheet" href="../src/style.css">
    <link rel="stylesheet" href="../src/sidebar.css">
    <link rel="stylesheet" href="../src/responsive.css">

</head>

<body>

<div class="admin-page">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a class="logo" href="../admin/dashboard.html">
                <img src="../public/school-logo.svg" alt="Logo" class="logo-image">
                <span class="logo-text">Sululta School</span>
            </a>
        </div>
        <nav class="sidebar-nav" aria-label="Admin navigation">
            <a href="../admin/dashboard.html" class="nav-item"><span class="nav-text">Dashboard</span></a>
            <a href="../students/dashboard.html" class="nav-item"><span class="nav-text">Students</span></a>
            <a href="../teachers/dashboard.html" class="nav-item"><span class="nav-text">Teachers</span></a>
            <a href="../classes/dashboard.html" class="nav-item active"><span class="nav-text">Classes</span></a>
            <a href="../subjects/dashboard.html" class="nav-item"><span class="nav-text">Subjects</span></a>
            <a href="../attendance/dashboard.html" class="nav-item"><span class="nav-text">Attendance</span></a>
            <a href="../results/dashboard.html" class="nav-item"><span class="nav-text">Results</span></a>
            <a href="../timetable/dashboard.html" class="nav-item"><span class="nav-text">Timetable</span></a>
            <a href="../library/dashboard.html" class="nav-item"><span class="nav-text">Library</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="nav-item" id="logoutBtn"><span class="nav-text">Logout</span></a>
        </div>
    </aside>
    <main class="admin-main">

        <header class="admin-header">

            <div class="header-left">

                <button
                    type="button"
                    class="sidebar-toggle"
                    id="sidebarToggle"
                >
                    Menu
                </button>

                <div>

                    <span class="header-label">
                        Academic Management
                    </span>

                    <h1>
                        Classes
                    </h1>

                </div>

            </div>

            <div class="admin-profile">

                <div class="admin-avatar">
                    A
                </div>

                <div class="admin-profile-info">

                    <strong>
                        Administrator
                    </strong>

                    <span>
                        Admin
                    </span>

                </div>

            </div>

        </header>

        <section class="page-container">

            <div class="page-header">

                <div class="header-left">

                    <div class="page-icon">
                        ??
                    </div>

                    <div>

                        <h1>
                            Edit Class
                        </h1>

                        <p>
                            Update class information
                        </p>

                    </div>

                </div>

                <div class="header-actions">

                    <a
                        href="dashboard.html"
                        class="btn btn-secondary"
                    >
                        ? Back
                    </a>

                </div>

            </div>

            <div
                id="message"
                class="message"
            ></div>

            <div class="form-card">

                <form
                    id="editClassForm"
                    novalidate
                >

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="class_name">
                                Class Name
                                <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="class_name"
                                name="class_name"
                                placeholder="Example: Grade 9"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label for="section">
                                Section
                                <span>*</span>
                            </label>

                            <input
                                type="text"
                                id="section"
                                name="section"
                                placeholder="Example: A"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label for="room_number">
                                Room Number
                            </label>

                            <input
                                type="text"
                                id="room_number"
                                name="room_number"
                                placeholder="Example: 101"
                            >

                        </div>

                        <div class="form-group">

                            <label for="academic_year">
                                Academic Year
                            </label>

                            <input
                                type="text"
                                id="academic_year"
                                name="academic_year"
                                placeholder="Example: 2025/26"
                            >

                        </div>

                        <div class="form-group">

                            <label for="class_teacher">
                                Class Teacher
                            </label>

                            <select
                                id="class_teacher"
                                name="class_teacher"
                            >

                                <option value="">
                                    Select Teacher
                                </option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label for="status">
                                Status
                                <span>*</span>
                            </label>

                            <select
                                id="status"
                                name="status"
                                required
                            >

                                <option value="active">
                                    Active
                                </option>

                                <option value="inactive">
                                    Inactive
                                </option>

                            </select>

                        </div>

                    </div>

                    <div class="form-actions">

                        <a
                            href="dashboard.html"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                        <button
                            type="submit"
                            id="saveButton"
                            class="btn btn-primary"
                        >
                            Save Changes
                        </button>

                    </div>

                </form>

            </div>

        </section>

        <footer class="admin-footer">

            <span>
                � 2026 Sululta School Portal
            </span>

            <span>
                School Management System
            </span>

        </footer>

    </main>

</div>

<script
    type="module"
    src="../src/edit-class.js"
></script>

</body>

</html>
